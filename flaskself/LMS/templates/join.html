{% extends 'layout.html' %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6"> <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4">회원가입 (1/2)</h3>
                        <form action="/join" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">아이디</label>
                                <input type="text" name="uid" class="form-control" placeholder="사용할 아이디 입력" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">비밀번호</label>
                                <input type="password" name="password" class="form-control" placeholder="비밀번호 입력" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">이름</label>
                                <input type="text" name="name" class="form-control" placeholder="실명 입력" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">이메일(선택)</label>
                                <div class="input-group">
                                    <input type="text" name="email_id" class="form-control" placeholder="영문아이디">
                                    <span class="input-group-text">@</span>
                                    <input type="text" name="email_domain" class="form-control" placeholder="naver.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">주소 (선택)</label>
                                <div class="input-group mb-2">
                                    <input type="text" id="address" name="address" class="form-control" placeholder="주소를 검색하세요" readonly>
                                    <button class="btn btn-outline-secondary" type="button" onclick="execDaumPostcode()">주소 검색</button>
                                </div>
                                <input type="text" name="address_detail" class="form-control" placeholder="상세 주소 입력">
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2">다음 단계로 (강의 선택)</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="/login" class="text-decoration-none text-muted small">이미 계정이 있으신가요? 로그인</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById("address").value = data.address;
                }
            }).open();
        }
    </script>
{% endblock %}
