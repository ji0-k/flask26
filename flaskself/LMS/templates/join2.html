{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">수강 강의 선택 (2/2)</h3>
                    <p class="text-center text-muted small">각 항목에서 수강할 강의를 하나씩 선택해주세요.</p>

                    <form action="/join2" method="POST" onsubmit="return validateForm()">

                        <div class="mb-4">
                            <label class="form-label fw-bold">1. 백엔드 언어 (필수)</label>
                            <div class="list-group">
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="backend" value="Java" required> Java
                                </label>
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="backend" value="Python"> Python
                                </label>
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="backend" value="Node.js"> Node.js
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">2. 서버 (필수)</label>
                            <div class="list-group">
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="server" value="AWS" required> AWS
                                </label>
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="server" value="Docker"> Docker
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">3. DB (필수)</label>
                            <div class="list-group">
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="db" value="MySQL" required> MySQL
                                </label>
                                <label class="list-group-item">
                                    <input class="form-check-input me-2" type="radio" name="db" value="Oracle"> Oracle
                                </label>
                            </div>
                        </div>

                        <div class="row g-2">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100 py-2">가입 및 신청 완료</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function validateForm() {
    // 필수 선택 체크 로직
    const backend = document.querySelector('input[name="backend"]:checked');
    const server = document.querySelector('input[name="server"]:checked');
    const db = document.querySelector('input[name="db"]:checked');

    if (!backend || !server || !db) {
        alert("모든 항목을 선택해야 가입이 완료됩니다.");
        return false;
    }
    return true;
}
</script>
{% endblock %}
