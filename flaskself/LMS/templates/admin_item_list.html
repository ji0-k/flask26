{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5">
    <h3 class="mb-4">상품 수정 관리</h3>
    <table class="table table-bordered align-middle">
        <thead class="table-dark">
            <tr>
                <th>코드</th>
                <th>상품명</th>
                <th>카테고리</th>
                <th>가격</th>
                <th>재고</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.code }}</td>
                <td>{{ item.name }}</td>
                <td><span class="badge bg-info text-dark">{{ item.category }}</span></td>
                <td>{{ "{:,}".format(item.price) }}원</td>
                <td>{{ item.stock }}개</td>
                <td>
                    <a href="/shop/admin/item_modify/{{ item.id }}" class="btn btn-sm btn-warning">수정</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
