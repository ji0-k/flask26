{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white"><h5>상품 등록 (관리자)</h5></div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">상품 코드</label>
                            <input type="text" name="code" class="form-control" placeholder="예: ITEM001" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">상품명</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">카테고리</label>
                            <select name="category" class="form-select">
                                <option value="교재">교재</option>
                                <option value="사무용품">사무용품</option>
                                <option value="프로그램">프로그램</option>
                                <option value="기기장치">기기장치</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">가격</label>
                                <input type="number" name="price" class="form-control" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">초기 재고</label>
                                <input type="number" name="stock" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">상품 등록하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
